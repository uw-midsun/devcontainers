name: Build & Push Docker Image

on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

permissions:
  packages: write

jobs:
  fwxvii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        name: Checkout Repository
        with:
          persist-credentials: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ghcr.io/uw-midsun/devcontainers/fwxvii
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        name: Container Registry Login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd
        name: Install Nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: ./fwxvii/build
  fwxvi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        name: Checkout Repository
        with:
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        name: Setup Docker Buildx
        with:
          platforms: linux/amd64,linux/arm64

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ghcr.io/uw-midsun/devcontainers/fwxvi
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        name: Container Registry Login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        name: Docker Build & Push
        with:
           push: true
           tags: ${{ steps.meta.outputs.tags }}
           context: ./fwxvi
           file: ./fwxvi/Containerfile
           platforms: linux/arm64, linux/amd64
